<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>expctl — switch experiments</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; color: #222; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  tr.sel { background: #eef4ff; }
  tr { cursor: pointer; }
  .s-running, .s-stopping { color: #0a6; font-weight: 600; }
  .s-queued { color: #a60; }
  .s-failed, .s-interrupted { color: #c22; }
  .s-stopped { color: #666; }
  fieldset { border: 1px solid #ccc; margin: 1rem 0; padding: .75rem; }
  label { display: block; margin: .3rem 0; }
  input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; }
  pre { background: #f6f6f6; padding: .75rem; overflow: auto; max-height: 28rem; font-size: 12px; }
  button { margin-right: .3rem; }
  #err { color: #c22; }
</style>
</head>
<body>
<h1>expctl — switch experiments</h1>

<label>Token <input type="password" id="token" autocomplete="off"></label>
<p id="err" role="alert"></p>

<fieldset>
  <legend>Queue a run</legend>
  <label>Name <input type="text" id="name" placeholder="e.g. block-A-rtt"></label>
  <label>experiment.sh arguments
    <textarea id="args" rows="2" placeholder="--method switch --reps 10 --delays 0"></textarea>
  </label>
  <button id="queue">Queue</button>
</fieldset>

<table>
  <thead><tr><th>Run</th><th>Status</th><th>Results</th><th>Current</th><th>Commit</th><th>Actions</th></tr></thead>
  <tbody id="runs"></tbody>
</table>

<div id="detail" hidden>
  <h2 id="d-title" style="font-size:1rem"></h2>
  <p id="d-args"></p>
  <button id="show-report">Report</button> <button id="show-log">Log</button>
  <pre id="d-out"></pre>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('token').value = localStorage.getItem('expctl-token') || '';
$('token').onchange = () => { localStorage.setItem('expctl-token', $('token').value); refresh(); };
let selected = null, pane = 'log';

async function api(method, path, body) {
  const r = await fetch('/api' + path, {
    method, body: body && JSON.stringify(body),
    headers: { Authorization: 'Bearer ' + $('token').value, 'Content-Type': 'application/json' },
  });
  const text = await r.text();
  if (!r.ok) throw new Error(text);
  return r.headers.get('Content-Type').startsWith('application/json') ? JSON.parse(text) : text;
}

async function act(fn) {
  try { $('err').textContent = ''; await fn(); await refresh(); }
  catch (e) { $('err').textContent = e.message; }
}

async function refresh() {
  if (!$('token').value) return;
  try {
    const runs = await api('GET', '/runs');
    $('err').textContent = '';
    $('runs').innerHTML = runs.slice().reverse().map(r => {
      const p = r.progress, n = p.total ? `${p.results}/${p.total}` : p.results;
      const btn = [];
      if (r.status === 'running' || r.status === 'queued') btn.push(`<button data-a="stop" data-id="${esc(r.id)}">Stop</button>`);
      if (['stopped','failed','interrupted'].includes(r.status)) btn.push(`<button data-a="resume" data-id="${esc(r.id)}">Resume</button>`);
      return `<tr data-id="${esc(r.id)}" class="${r.id === selected ? 'sel' : ''}">
        <td>${esc(r.id)}</td><td class="s-${esc(r.status)}">${esc(r.status)}</td><td>${esc(n)}</td>
        <td>${esc(p.current)}</td><td>${esc(r.commit)}${r.dirty ? '*' : ''}</td><td>${btn.join('')}</td></tr>`;
    }).join('');
    if (selected) await showDetail(runs.find(r => r.id === selected));
  } catch (e) { $('err').textContent = e.message; }
}

async function showDetail(r) {
  if (!r) return;
  $('detail').hidden = false;
  $('d-title').textContent = `${r.id} — ${r.status}`;
  $('d-args').textContent = 'experiment.sh ' + r.args.join(' ');
  $('d-out').textContent = await api('GET', `/runs/${r.id}/${pane === 'log' ? 'log?tail=200' : 'report'}`);
}

$('runs').onclick = e => {
  const b = e.target.closest('button');
  if (b) return act(() => api('POST', `/runs/${b.dataset.id}/${b.dataset.a}`));
  const tr = e.target.closest('tr');
  if (tr) { selected = tr.dataset.id; refresh(); }
};
$('queue').onclick = () => act(async () => {
  const args = $('args').value.trim().split(/\s+/).filter(Boolean);
  await api('POST', '/runs', { name: $('name').value.trim(), args });
  $('name').value = ''; $('args').value = '';
});
$('show-report').onclick = () => { pane = 'report'; refresh(); };
$('show-log').onclick = () => { pane = 'log'; refresh(); };
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
